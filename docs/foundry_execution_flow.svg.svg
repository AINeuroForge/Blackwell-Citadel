<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="220" viewBox="0 0 1100 220">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#94a3b8"></path>
    </marker>
  </defs>

  <!-- Style constants via attributes (GitHub-safe) -->
  <!-- Colors -->
  <!-- box fill: #0b1220 (deep navy) -->
  <!-- box stroke: #3b82f6 (blue) -->
  <!-- arrow stroke: #94a3b8 (slate) -->
  <!-- fail stroke: #ef4444 (red) -->

  <!-- Boxes row -->
  <rect x="40" y="50" width="120" height="44" rx="6" fill="#0b1220" stroke="#3b82f6" stroke-width="2"></rect>
  <text x="100" y="77" fill="#ffffff" font-family="Arial" font-size="14" text-anchor="middle">Preflight</text>

  <rect x="190" y="50" width="120" height="44" rx="6" fill="#0b1220" stroke="#3b82f6" stroke-width="2"></rect>
  <text x="250" y="77" fill="#ffffff" font-family="Arial" font-size="14" text-anchor="middle">Build</text>

  <rect x="340" y="50" width="120" height="44" rx="6" fill="#0b1220" stroke="#3b82f6" stroke-width="2"></rect>
  <text x="400" y="77" fill="#ffffff" font-family="Arial" font-size="14" text-anchor="middle">TRT Run</text>

  <rect x="490" y="50" width="120" height="44" rx="6" fill="#0b1220" stroke="#3b82f6" stroke-width="2"></rect>
  <text x="550" y="77" fill="#ffffff" font-family="Arial" font-size="14" text-anchor="middle">ONNX Export</text>

  <rect x="640" y="50" width="120" height="44" rx="6" fill="#0b1220" stroke="#3b82f6" stroke-width="2"></rect>
  <text x="700" y="77" fill="#ffffff" font-family="Arial" font-size="14" text-anchor="middle">ORT Run</text>

  <rect x="790" y="50" width="120" height="44" rx="6" fill="#0b1220" stroke="#3b82f6" stroke-width="2"></rect>
  <text x="850" y="77" fill="#ffffff" font-family="Arial" font-size="14" text-anchor="middle">Compare</text>

  <rect x="940" y="50" width="120" height="44" rx="6" fill="#0b1220" stroke="#3b82f6" stroke-width="2"></rect>
  <text x="1000" y="77" fill="#ffffff" font-family="Arial" font-size="14" text-anchor="middle">Benchmark</text>

  <!-- Fail box -->
  <rect x="790" y="150" width="270" height="44" rx="6" fill="#0b1220" stroke="#ef4444" stroke-width="2"></rect>
  <text x="925" y="177" fill="#ffffff" font-family="Arial" font-size="14" text-anchor="middle">Stop — Contract Violation</text>

  <!-- Arrows along the top row -->
  <line x1="160" y1="72" x2="190" y2="72" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"></line>
  <line x1="310" y1="72" x2="340" y2="72" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"></line>
  <line x1="460" y1="72" x2="490" y2="72" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"></line>
  <line x1="610" y1="72" x2="640" y2="72" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"></line>
  <line x1="760" y1="72" x2="790" y2="72" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"></line>
  <line x1="910" y1="72" x2="940" y2="72" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"></line>

  <!-- Gate arrows from Compare -->
  <!-- Pass: Compare -> Benchmark (label) -->
  <text x="925" y="38" fill="#94a3b8" font-family="Arial" font-size="12" text-anchor="middle">Pass</text>

  <!-- Fail: Compare down to Stop -->
  <path d="M850,94 L850,150" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"></path>
  <text x="860" y="125" fill="#ef4444" font-family="Arial" font-size="12">Fail</text>

</svg>